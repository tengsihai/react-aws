name: 发布到 prod 环境

# 分支即环境：合并进 prod 就发布 prod。
# 合并 PR 就是审批；生产发布再加一道人工审批，在 `prod` Environment 上配置
# Required reviewers 即可（本工作流本身不再提供手动触发）。
#
# 发布完成后，把 prod 通过 PR 合并到 main 完成归档；main 不触发任何部署。
#
# 需要配置 GitHub Environment `prod`：
#   Variables: S3_BUCKET_NAME、CLOUDFRONT_DISTRIBUTION_ID、VITE_API_BASE_URL
#   Secret:    AWS_DEPLOY_ROLE_ARN
#   Protection rules: Required reviewers（建议）
on:
  push:
    branches: [prod]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # 未接入的环境直接跳过；生产环境接入时把 DEPLOY_ENVIRONMENTS 加上 prod。
    if: contains(fromJSON(vars.DEPLOY_ENVIRONMENTS || '["dev"]'), 'prod')
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
    secrets: inherit
