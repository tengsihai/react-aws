name: 持续集成

# 发布检查：
#   - 所有 PR 都跑类型检查与构建
#   - push 到 main / dev / staging / prod 也跑
# main 是归档分支，只跑检查，不触发发布。
on:
  pull_request:
  push:
    branches: [main, dev, staging, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 类型检查与构建
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build
