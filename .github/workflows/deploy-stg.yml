name: 发布到 stg 环境（占位）

# 占位工作流：stg 环境的基础设施配置完成后即可直接使用，无需再改代码。
# 触发方式：Actions 页面手动运行，建议从 dev 分支发布做预发验证。
#
# 需要在 GitHub 仓库 Settings → Environments 中创建 stg 环境，并配置：
#   Variables: S3_BUCKET_NAME、CLOUDFRONT_DISTRIBUTION_ID、VITE_API_BASE_URL
#   Secret:    AWS_DEPLOY_ROLE_ARN（可复用仓库级 Secret）
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-stg
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: stg
      archive_to_main: false
    secrets: inherit
