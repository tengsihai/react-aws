name: 部署前端（可复用工作流）

# 由各环境的工作流调用（deploy-dev / deploy-staging / deploy-prod），
# 本文件不直接监听分支事件，避免同一份逻辑复制三遍。
#
# 分支即环境：合并进哪条环境分支，就发布哪个环境；main 只做归档，不调用本工作流。
#
# 本流水线只负责「构建前端 → 同步静态资源 → 刷新 CloudFront 缓存」。
# S3 桶、CloudFront 分发、OIDC 部署角色等基础设施由独立的基础设施工程创建与维护，
# 各环境的差异通过 GitHub Environments 中的变量隔离。
on:
  workflow_call:
    inputs:
      environment:
        description: 目标环境（dev / staging / prod）
        required: true
        type: string

# 调用方需要授予相应权限；job 内可继续降级
permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: 构建并发布到 ${{ inputs.environment }}
    runs-on: ubuntu-latest

    # 声明环境后，下面的 vars.* 会读取该环境专属的变量
    # （Settings → Environments → <env> → Environment variables）
    environment:
      name: ${{ inputs.environment }}

    env:
      APP_ENV: ${{ inputs.environment }}
      # 区域主要用于 AWS SDK；S3 桶可与该区域不同，aws s3 sync 会自动处理
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 校验发布配置
        run: |
          # 缺少任一配置都直接失败，避免发布出无法访问或无法调用接口的版本
          missing=0
          for name in S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID VITE_API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::环境 ${APP_ENV} 缺少变量 ${name}，请先完成基础设施配置"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        env:
          # 注入到前端，用于页面上的环境标识
          VITE_APP_ENV: ${{ inputs.environment }}
        run: npm run build

      - name: 配置 AWS 凭证（OIDC）
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-react-aws-${{ inputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 确认目标资源存在
        run: |
          # 提前给出明确错误，而不是等到同步阶段才失败。
          # 分发存在性用 list-invalidations 探测，避免依赖 cloudfront:GetDistribution 权限。
          aws s3api head-bucket --bucket "$S3_BUCKET_NAME"
          aws cloudfront list-invalidations \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --max-items 1 \
            --query "InvalidationList.Quantity" \
            --output text

      - name: 同步构建产物到 S3
        run: |
          # 带内容哈希的静态资源可以长期缓存
          aws s3 sync dist/ "s3://$S3_BUCKET_NAME" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

          # index.html 不缓存，保证发布后用户立即拿到新版本
          aws s3 cp dist/index.html "s3://$S3_BUCKET_NAME/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: 刷新 CloudFront 缓存
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text

      - name: 写入发布摘要
        run: |
          {
            echo "### 🚀 发布完成（${APP_ENV}）"
            echo ""
            echo "- 环境：\`${APP_ENV}\`"
            echo "- 分支：\`${GITHUB_REF_NAME}\`"
            echo "- 提交：\`${GITHUB_SHA::7}\`"
            echo "- 静态资源桶：\`${S3_BUCKET_NAME}\`"
            echo "- CloudFront 分发：\`${CLOUDFRONT_DISTRIBUTION_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
