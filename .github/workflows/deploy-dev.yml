name: 发布到 dev 环境

# dev 分支是发布分支：人工把功能分支合并到 dev 后，本流水线自动构建并发布。
# 发布成功后自动把 main 快进到本次提交，完成归档。
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: write # 归档任务需要向 main 推送

# 同一时间只允许一个发布任务，避免并发写同一个 S3 桶
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      archive_to_main: true
    secrets: inherit
